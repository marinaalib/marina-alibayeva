html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Task Planner</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-card">
        <h2>Task Planner 📝</h2>
        
        <!-- User Information -->
        <div class="form-group">
            <label for="userName">What is your name?</label>
            <input type="text" id="userName" placeholder="Name">
        </div>

        <!-- Calculation Data -->
        <div class="form-group">
            <label for="taskCount">How many tasks today?</label>
            <input type="number" id="taskCount" value="0">
        </div>

        <div class="form-group">
            <label for="timePerTask">Minutes per task:</label>
            <input type="number" id="timePerTask" value="20">
        </div>

        <div class="form-group">
            <label for="freeTime">Your daily limit (minutes):</label>
            <input type="number" id="freeTime" value="60">
        </div>

        <!-- This button calls the calculatePlan function from script.js -->
        <button onclick="calculatePlan()">Calculate Plan</button>

        <!-- The results will appear inside this div -->
        <div id="display-output"></div>
    </div>

    <!-- Link to the external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
